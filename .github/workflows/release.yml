# Publish to crates.io on a version tag.
#
# Written from scratch rather than adapted from gglib: that workspace is
# AGPL-3.0 and has never been on crates.io, so its release.yml builds and
# attests binaries and has no `cargo publish` in it at all. Nothing to copy.
#
# One-time setup, before the first release — these live in GitHub Settings,
# not in the repo, and two of them fail OPEN if forgotten:
#
#   * a `crates-io` environment with a REQUIRED REVIEWER and an
#     environment-scoped CARGO_REGISTRY_TOKEN. A workflow that references a
#     nonexistent environment makes GitHub silently auto-create it with no
#     reviewers and no secrets; the publish job asserts the token is
#     non-empty so that dies loudly, but the reviewer gate can only come
#     from Settings.
#   * a tag ruleset restricting creation of v* tags to the repo admin.
#     Branch protection does not cover tags; the ancestry check below
#     refuses tags off main, and the ruleset stops stray tags at the push.
#
# Cutting a release (release-plz owns everything before the tag):
#
#   1. merge the release PR that release-plz keeps open — it carries the
#      version bump (both sites in Cargo.toml, so ci.yml's drift check stays
#      green) and the changelog. For a deliberate jump release-plz will not
#      make on its own (0.0.x → 0.1.0), run `make bump VERSION=0.1.0` in an
#      ordinary PR first; release-plz respects the hand-set version
#   2. release-plz pushes the vX.Y.Z tag, which starts this workflow
#   3. approve the crates-io environment when the publish job asks
#
# Publishing is irreversible: a version can be yanked but never replaced, and
# the name is claimed forever by the first publish. The `verify` job below is
# the last point at which that is still true of nothing.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # Dry runs. Every check below runs, `cargo publish` runs with --dry-run, and
  # nothing is uploaded.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestry check below needs real history, not a shallow tip.
          fetch-depth: 0

      # Branch protection covers branches, not tags: nothing else in this
      # repo stops `git push origin vX.Y.Z` at a commit main never accepted
      # from publishing it. This does. (Pair it with a v* tag ruleset in the
      # repo settings — see the header of this file — so stray tags are
      # stopped at the push, not here.)
      - name: Check the tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main"

      - name: Install Rust toolchain
        run: rustup show

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "release-verify"
          cache-on-failure: true

      # ci.yml triggers on pushes to main and on pull requests, so a tag push
      # runs none of it. Every gate ci.yml runs is repeated here, so a tag on
      # a commit CI never saw is still checked; the only piece not repeated
      # is the cross-OS matrix, which needs runners this job does not have.
      #
      # That sentence was false for a while, which is worth recording where
      # somebody might otherwise trim the list back: `cargo check -p
      # modelpipe --locked` and the package check were both missing, and the
      # first has no substitute anywhere else in this file — every other
      # build here unifies features across the workspace and therefore
      # cannot see a feature the library uses without declaring.
      # (What binds the tag to a commit that actually PASSED ci.yml is the
      # ancestry check above plus branch protection on main, not this job —
      # and `--is-ancestor` accepts intermediate commits of a merged branch,
      # which is precisely why the gates are repeated rather than assumed.)
      # This job exists to be the last point at which nothing is true yet, and
      # cargo publishes a crate full of `todo!()` exactly as happily as a
      # working one. Publishing is irreversible; a grep is not.
      - name: Refuse to publish unimplemented code
        run: |
          if grep -rn --include='*.rs' -E '\b(todo!|unimplemented!)\(' modelpipe/src modelpipe-cli/src; then
            echo "::error::the tree above still has unimplemented bodies"
            exit 1
          fi
          echo "no unimplemented bodies"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate workflow YAML
        run: ./scripts/check_workflow_yaml.sh

      # The architecture gates, which need no toolchain: the file-size budget
      # and the ticket vectors. The second is the one that matters most here
      # — docs/ticket-format-v0.md ships in the published tarball as
      # normative surface that other languages implement against, and nothing
      # else on the path that publishes it checks the page against the
      # reference implementation.
      - name: Run the architecture gates
        run: make enforce

      # Fails if Cargo.lock is stale or absent. Every cargo command below
      # already passes `--locked`, so this catches nothing they would miss —
      # it is here so the claim above is literally true rather than true in
      # effect, and so the failure names the lockfile instead of arriving as
      # a confusing clippy error.
      - name: Lockfile guard
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # The library on its OWN feature set. Every command either side of
      # this one is `--workspace` or `--all-features`, and those unify
      # features across members — so a feature the library uses but does not
      # declare is supplied by modelpipe-cli and the gap stays invisible
      # right up until somebody depends on `modelpipe` alone. ci.yml has run
      # this since the day tokio's `rt` turned out to be arriving free from
      # iroh; it was the one gate the header below claimed to repeat and did
      # not, on the release that first publishes the library to strangers
      # and where a wrong manifest cannot be fixed without a new version.
      - name: Check the library builds on its own features
        run: cargo check -p modelpipe --locked

      # The publishable-metadata guard, also from ci.yml. `cargo publish
      # --dry-run` below is a superset in practice, but it runs eleven steps
      # later and this one costs seconds: a missing `version` on the path
      # dependency should fail here, with a message about manifests, rather
      # than inside a publish rehearsal.
      - name: Check the crates still package
        run: cargo package --workspace --no-verify --locked

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Check rustdoc has no warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p modelpipe --no-deps --document-private-items --locked

      # And again as docs.rs builds it. Not a duplicate: an intra-doc link
      # from a public item to a private one RESOLVES under
      # --document-private-items and 404s on the published page, so the step
      # above cannot see the one audience that matters. The 0.1.0 page is
      # built once and never rebuilt, which makes a broken link permanent.
      - name: Check rustdoc as docs.rs builds it
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p modelpipe --no-deps --locked

      # A tag that disagrees with the manifest publishes a version nobody asked
      # for under a tag that will forever point at the wrong tree. Cheap to
      # check, impossible to undo. Read through the bump script's --check
      # mode, which also fails if the two version sites in Cargo.toml have
      # drifted apart — the one incoherence caret semantics stop catching
      # after 0.1.0.
      # Unconditional, unlike the tag comparison it feeds: the two version
      # sites in Cargo.toml agreeing is a property of the tree, not of how
      # this workflow was started, and a `workflow_dispatch` rehearsal that
      # skipped it was not rehearsing the thing it exists to rehearse.
      - name: Check the version sites agree
        run: ./scripts/bump_version.py --check > /dev/null

      - name: Check tag matches the manifest version
        if: github.event_name == 'push'
        run: |
          manifest="$(./scripts/bump_version.py --check)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$manifest" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME says $tag, Cargo.toml says $manifest"
            exit 1
          fi
          echo "tag and manifest agree on $manifest"

      # --workspace, not two -p runs. modelpipe-cli depends on modelpipe by
      # version, so packaging it alone resolves that against the registry and
      # fails for as long as the version being released is not yet published —
      # which is always, at this point in the job. --workspace makes the
      # members resolve against each other locally, and is also what orders the
      # real publish below.
      - name: Dry-run the publish
        run: cargo publish --workspace --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: [verify]
    # Job-level, not step-level: a workflow_dispatch dry run ends at
    # `verify`, instead of parking the publish job on a human approval whose
    # only outcome would be an echo. Approvals people grant to no-ops are
    # approvals they stop reading.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Requires a repository environment named `crates-io` holding
    # CARGO_REGISTRY_TOKEN, with a required reviewer on it: this is the step
    # that cannot be taken back, and a human ack costs one click. That
    # environment is one-time manual setup (see this file's header) — GitHub silently
    # auto-creates a referenced environment with NO reviewers and NO
    # secrets, which is why the first step below refuses to run without the
    # token rather than trusting the environment to exist.
    environment: crates-io
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "release-verify"
          cache-on-failure: true

      - name: Assert the registry token is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is empty — the crates-io environment is missing or unconfigured (GitHub auto-creates referenced environments with no secrets and no reviewers; see this workflow's header comment)"
            exit 1
          fi
          echo "registry token present"

      # Makes a re-run safe after a partial failure — e.g. the GitHub
      # release step below dying after a successful publish. modelpipe-cli
      # is published last, so its presence means the whole publish landed.
      # (The narrower partial — library up, CLI not — needs a manual
      # `cargo publish -p modelpipe-cli --locked` from the tagged commit.)
      #
      # The User-Agent is not optional and this step did not send one.
      # crates.io has required it since 2017 and answers a request without
      # one with 403, which `curl -f` reports as failure — so this guard
      # took the "not published" branch every single time, including the
      # one run it exists for. Measured from a machine with no
      # authentication: /api/v1/crates/serde/1.0.0 answers 403 bare and 200
      # with any UA at all; a version that genuinely does not exist answers
      # 404. A guard that cannot distinguish those is not a guard.
      #
      # Anything other than 200 or 404 is now a failure rather than a
      # "no", because the whole point is to be certain before an upload
      # that cannot be taken back: a rate-limit or an outage must stop the
      # job, not read as permission to publish again.
      - name: Check whether this version is already published
        id: published
        env:
          UA: "modelpipe-release (+https://github.com/mmogr/modelpipe)"
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://crates.io/api/v1/crates/modelpipe-cli/${version}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" "$url")"
          case "$code" in
            200)
              echo "already=true" >> "$GITHUB_OUTPUT"
              echo "modelpipe-cli ${version} is already on crates.io — skipping publish"
              ;;
            404)
              echo "already=false" >> "$GITHUB_OUTPUT"
              echo "modelpipe-cli ${version} is not on crates.io yet"
              ;;
            *)
              echo "::error::crates.io answered ${code} for ${url}; refusing to guess whether ${version} is published"
              exit 1
              ;;
          esac

      # One command for both crates. cargo publishes them in dependency order
      # (library first) and waits for each to appear in the index before the
      # next, which is the sleep-and-retry loop this would otherwise have been.
      - name: Publish
        if: steps.published.outputs.already != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
